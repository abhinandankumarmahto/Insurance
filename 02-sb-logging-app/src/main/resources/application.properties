spring.application.name=02-sb-logging-app
server.port=9090

logging.file.name=app.log
logging.logback.rollingpolicy.file-name-pattern=app-%d{yyyy-mm-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=1 MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=10MB
